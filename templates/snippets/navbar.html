{% load static %}
<aside class="w-64 min-h-full bg-base-200 shadow-lg flex flex-col">
  <!-- Header -->
  <div class="p-4 border-b border-base-300">
    <h2 class="text-xl font-bold text-primary flex items-center gap-2">
      <i class="fa-solid fa-store text-2xl"></i>
      <span>pyPOS</span>
    </h2>
    <p class="text-sm text-base-content/70 mt-1">Point of Sale System</p>
  </div>

  <!-- Navigation Menu -->
  <div class="flex-grow overflow-y-auto">
    <ul class="menu p-4 space-y-2">
      <li>
        <a href="{% url 'store_index' %}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-primary hover:text-primary-content transition-colors group {% if request.resolver_match.url_name == 'store_index' %}active bg-primary text-primary-content{% endif %}">
          <i class="fa-solid fa-house text-xl group-hover:scale-110 transition-transform"></i>
          <span class="font-medium">Dashboard</span>
        </a>
      </li>

      <li>
        <a href="{% url 'product_create' %}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-primary hover:text-primary-content transition-colors group {% if request.resolver_match.url_name == 'product_create' %}active bg-primary text-primary-content{% endif %}">
          <i class="fa-solid fa-box text-xl group-hover:scale-110 transition-transform"></i>
          <span class="font-medium">Restock Produk</span>
        </a>
      </li>

      <li>
        <a href="{% url 'transaksi' %}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-primary hover:text-primary-content transition-colors group {% if request.resolver_match.url_name == 'transaksi' %}active bg-primary text-primary-content{% endif %}">
          <i class="fa-solid fa-cart-shopping text-xl group-hover:scale-110 transition-transform"></i>
          <span class="font-medium">Transaksi Penjualan</span>
        </a>
      </li>

      <li>
        <a href="{% url 'history_transactions' %}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-primary hover:text-primary-content transition-colors group {% if request.resolver_match.url_name == 'history_transactions' or request.resolver_match.url_name == 'transaksi_detail' %}active bg-primary text-primary-content{% endif %}">
          <i class="fa-solid fa-clock-rotate-left text-xl group-hover:scale-110 transition-transform"></i>
          <span class="font-medium">Riwayat Transaksi</span>
        </a>
      </li>

      <div class="divider my-2"></div>

      <li>
        <a href="/admin/" target="_blank" class="flex items-center gap-3 p-3 rounded-lg hover:bg-primary hover:text-primary-content transition-colors group">
          <i class="fa-solid fa-gear text-xl group-hover:scale-110 transition-transform"></i>
          <span class="font-medium">Admin Panel</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Footer -->
  <div class="p-4 border-t border-base-300 bg-base-200">
    <div class="text-center text-sm text-base-content/50">
      <p>© 2026 pyPOS</p>
      <p class="text-xs mt-1">v1.0.0</p>
    </div>
  </div>
</aside>
